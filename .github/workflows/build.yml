name: Build Rootless Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm make perl zip git wget curl

      - name: Setup Theos
        run: |
          rm -rf $THEOS
          git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: Setup Theos Toolchain (Linux)
        run: |
          # Скачиваем официальный Linux-тулчейн Theos (clang/ld64)
          if [ ! -d "$THEOS/toolchain/linux" ]; then
            bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos-toolchain.sh)" || true
          }
          # Фолбек на случай, если скрипт не отработал: симлинки на системный clang
          mkdir -p $THEOS/toolchain/linux/iphone/bin
          ln -sf /usr/bin/clang $THEOS/toolchain/linux/iphone/bin/clang
          ln -sf /usr/bin/clang++ $THEOS/toolchain/linux/iphone/bin/clang++
          ln -sf /usr/bin/llvm-strip $THEOS/toolchain/linux/iphone/bin/strip

      - name: Setup iOS SDK
        run: |
          mkdir -p $THEOS/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $THEOS/sdks_repo
          cp -r $THEOS/sdks_repo/*.sdk $THEOS/sdks/
          rm -rf $THEOS/sdks_repo

      - name: Build Package
        run: |
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceIdentityManager-Rootless-Debian
          path: ${{ github.workspace }}/packages/*.deb
          if-no-files-found: error
