name: Build Rootless Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang git llvm make perl zip

      - name: Setup Theos
        run: |
          rm -rf $THEOS
          git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: Setup iOS SDK
        run: |
          if [ ! -d "$THEOS/sdks" ]; then
            git clone https://github.com/theos/sdks.git $THEOS/sdks
          fi

      - name: Build Package
        run: |
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceIdentityManager-Rootless-Debian
          path: ${{ github.workspace }}/packages/*.deb
          if-no-files-found: error
